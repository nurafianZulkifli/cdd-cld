<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f8f4">
    <title>CDD-CLD | Select a Line</title>
    <link rel="icon" href="assets/img/core-img/logo.png" type="image/png">
    <link rel="stylesheet" href="assets/css/transit-ui.css">
    <link rel="stylesheet" href="assets/css/line-selector.css">
    <script src="https://kit.fontawesome.com/965e82ac01.js" crossorigin="anonymous"></script>
</head>
<body>
    <main class="line-selector">
        <header class="selector-header">
            <a class="brand" href="index.html" aria-label="CDD-CLD home">
                <img src="assets/img/core-img/logo.png" alt="">
                <span>CD/CL Display Redesign</span>
            </a>
            <div class="header-controls">
                <button class="theme-toggle-btn" type="button" aria-label="Theme: system" title="Theme: system - click to cycle">
                    <i class="fa-solid fa-gear" aria-hidden="true"></i>
                    <span class="theme-mode-indicator">S</span>
                </button>
            </div>
        </header>

        <section class="selector-intro" aria-labelledby="pageTitle">
            <p class="eyebrow">Ceiling Level & Car Door display simulator</p>
            <h1 id="pageTitle">Pick a Line</h1>
            <p class="intro-copy">Select a route to open its station announcements, messages, and door-closing displays.</p>
        </section>

        <nav class="line-grid" aria-label="MRT lines">
            <a class="line-option nsl" href="nsl.html">
                <img class="line-caplet" src="assets/caplets/NSLCap.png" alt="NSL">
                <span class="line-details">
                    <strong>North South Line</strong>
                    <span>to Marina South Pier/ to Jurong East</span>
                </span>
                <span class="line-arrow" aria-hidden="true">&rarr;</span>
            </a>
            <a class="line-option ccl" href="ccl.html">
                <img class="line-caplet" src="assets/caplets/CCLCap.png" alt="CCL">
                <span class="line-details">
                    <strong>Circle Line</strong>
                    <span>Clockwise/ Spur</span>
                </span>
                <span class="line-arrow" aria-hidden="true">&rarr;</span>
            </a>
            <a class="line-option nel" href="nel.html">
                <img class="line-caplet" src="assets/caplets/NELCap.png" alt="NEL">
                <span class="line-details">
                    <strong>North East Line</strong>
                    <span>to Punggol Coast</span>
                </span>
                <span class="line-arrow" aria-hidden="true">&rarr;</span>
            </a>
        </nav>
    </main>
    <script defer src="assets/js/line-selector.js"></script>
</body>
</html>
